[project]
name = "bitstamp-btcusd-minute-data"
version = "0.1.0"
description = "Daily updates of Bitstamp BTC/USD 1-minute OHLC data, with historical data since 2012"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mourits de Beer", email = "ff137@proton.me" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3,<3.0.0",
    "pyarrow>=21.0.0,<23.0.0",
    "requests>=2.34.2,<3.0.0",
]

[project.urls]
Repository = "https://github.com/ff137/bitstamp-btcusd-minute-data"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.4,<0.17.0",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
extend-exclude = ["README.md"]

[tool.uv]
exclude-newer = "7 days"
required-version = ">=0.12.0"
default-groups = ["dev"]
