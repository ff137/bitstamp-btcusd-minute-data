name: Fetch and Merge Crypto Data

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  # Managed installs so setup-uv cache-python can restore Python 3.14.7.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # No need to fetch the bulk data for this workflow

      # Step 2: Set up uv and Python 3.14.7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: uv sync --frozen

      # Step 4: Run the Python script to fetch and process data
      - name: Run data processing script
        run: |
          set -o pipefail
          uv run python scripts/update_data.py 2>&1 | tee script_output.log
          if grep -q "Successfully saved" script_output.log; then
            echo "SCRIPT_SUCCESS=true" >> "$GITHUB_ENV"
          else
            echo "SCRIPT_SUCCESS=false" >> "$GITHUB_ENV"
          fi

      # Step 5: Validate generated updates against the historical seam
      - name: Validate dataset seam
        if: env.SCRIPT_SUCCESS == 'true'
        run: |
          uv run python scripts/validate_dataset.py \
            --historical-tail tests/fixtures/historical_tail.csv \
            --updates data/updates/btcusd_bitstamp_1min_latest.csv

      # Step 6: Commit and push the validated daily update
      - name: Commit and Push Updates
        if: env.SCRIPT_SUCCESS == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates/btcusd_bitstamp_1min_latest.csv
          if git diff --cached --quiet; then
            echo "No dataset changes to publish."
            exit 0
          fi
          git commit -m ":package: Daily update: $(date -u +'%Y-%m-%d')"
          git push origin main
