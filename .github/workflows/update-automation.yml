name: Fetch and Merge Crypto Data

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI

env:
  # Managed installs so setup-uv cache-python can restore Python 3.14.7.
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false # Historical gzip is a regular git object; uncompressed CSV is not required.

      # Step 2: Set up uv and Python 3.14.7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: false
          cache-python: true
          python-version: "3.14.7"

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run data processing script
        run: uv run python scripts/update_data.py

      - name: Refresh provenance sidecar
        run: |
          # Fills, Statuspage, and price jumps only. Suspected rows come from
          # the frozen reviewed ledger; this step must not rewrite research/.
          uv run python scripts/provenance.py

      - name: Confirm research snapshot is unchanged
        run: |
          if git status --porcelain -- data/provenance/research | grep -q .; then
            echo "Daily provenance refresh must not mutate data/provenance/research" >&2
            git status --porcelain -- data/provenance/research >&2
            exit 1
          fi

      - name: Validate dataset seam
        run: |
          uv run python scripts/validate_dataset.py \
            --historical-tail tests/fixtures/historical_tail.csv \
            --updates data/updates/btcusd_bitstamp_1min_latest.csv

      - name: Validate provenance sidecar
        run: uv run python scripts/validate_provenance.py

      - name: Commit and Push Updates
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/updates/btcusd_bitstamp_1min_latest.csv \
            data/provenance/btcusd_bitstamp_1min.csv
          if git diff --cached --quiet; then
            echo "No dataset or provenance changes to publish."
          else
            git commit -m ":package: Daily update: $(date -u +'%Y-%m-%d')"
            git push origin main
          fi

      - name: Publish monthly snapshot if due
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/publish_monthly.py \
            --if-due \
            --publish \
            --output-dir artifacts/monthly-snapshot
